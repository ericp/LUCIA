<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>LUCIA Object Detection</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 1rem;
      }
      button {
        padding: 0.8rem 1.2rem;
        margin: 0.2rem;
        font-size: 1rem;
        border-radius: 10px;
      }
      video,
      canvas {
        max-width: 90%;
        border-radius: 12px;
        margin: 0.5rem 0;
      }
      #status {
        margin-top: 0.5rem;
        font-size: 1.1rem;
        white-space: pre-line;
      }
      #hints {
        font-size: 0.95rem;
        color: #555;
      }
      #correctionSection {
        margin-top: 1rem;
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>L.U.C.I.A.</h1>
    <p>Object Detection Assistant</p>

    <!-- Preview (for guidance) -->
    <video id="preview" playsinline autoplay muted></video>
    <canvas id="frame" style="display:none"></canvas>

    <!-- File input for final capture -->
    <input
      type="file"
      id="imageInput"
      accept="image/*"
      capture="environment"
      style="display:none"
    />

    <div>
      <button id="startBtn">Start guidance</button>
      <button id="captureBtn">Capture</button>
      <button id="stopBtn">Stop</button>
      <button id="audioTestBtn">Enable audio (test)</button>
    </div>

    <div id="status"></div>
    <div id="hints"></div>

    <div id="correctionSection">
      <h3>Incorrect label?</h3>
      <input type="text" id="newLabel" placeholder="Enter correct label" />
      <button id="correctBtn">Send correction</button>
    </div>

    <script>
      const API_BASE = ""; // mismo host

      const MIN_TTS_GAP_MS = 3000; // espera mínima entre locuciones (3s)
    
      let currentDetectionId = null;
      let mediaStream = null;
      let guideTimer = null;
    
      // ======== AUDIO CORE (iOS unlock) ========
      let audioCtx, osc, gain;
      async function ensureAudioUnlocked() {
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          if (audioCtx.state !== 'running') {
            await audioCtx.resume();
          }
          // “click” inaudible → desbloquea audio iOS
          const buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
          const src = audioCtx.createBufferSource();
          src.buffer = buffer;
          src.connect(audioCtx.destination);
          src.start(0);
        } catch (e) {}
      }
    
      function stopBeep() {
        try {
          if (osc) { osc.stop(); osc.disconnect(); osc = null; }
          if (gain) { gain.disconnect(); gain = null; }
        } catch (e) {}
      }
    
      async function beepBurst(freq = 800, vol = 0.1, durMs = 250) {
        try {
          await ensureAudioUnlocked();
          stopBeep();
          osc = audioCtx.createOscillator();
          gain = audioCtx.createGain();
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.value = vol;
          osc.start();
          setTimeout(() => stopBeep(), durMs);
        } catch (e) {}
      }
    
      // ======== SPEECH (con cooldown y dedupe) ========
      let lastSpeakAt = 0;
      let lastSpokenKey = "";
      let ttsWarmed = false;
    
      function speakPhone(text, key = "") {
        try {
          if (!('speechSynthesis' in window)) return;
          const now = Date.now();

          // no repetir el mismo mensaje seguido
          if (key && key === lastSpokenKey && (now - lastSpeakAt) < MIN_TTS_GAP_MS) return;
          // silencio mínimo global entre frases
          if ((now - lastSpeakAt) < MIN_TTS_GAP_MS) return;
          // si ya está hablando, no interrumpas
          if (window.speechSynthesis.speaking) return;

          // warm-up iOS sólo la primera vez
          if (!ttsWarmed) {
            const warm = new SpeechSynthesisUtterance(" ");
            window.speechSynthesis.speak(warm);
            setTimeout(() => {
              const u = new SpeechSynthesisUtterance(text);
              u.volume = 1.0; u.rate = 1.0; u.pitch = 1.0;
              window.speechSynthesis.speak(u);
            }, 150);
            ttsWarmed = true;
          } else {
            const u = new SpeechSynthesisUtterance(text);
            u.volume = 1.0; u.rate = 1.0; u.pitch = 1.0;
            window.speechSynthesis.speak(u);
          }

          lastSpeakAt = now;
          if (key) lastSpokenKey = key;
        } catch (e) {}
      }
    
      // ======== Hints -> GUI + Sonidos + Voz ========
      let lastHintState = { distance: null, center: null, light: null };
    
      function updateGuidance(hints /*, ready */) {
        if (!hints) return;
    
        const { distance, center, light } = hints;
        const changed =
          distance !== lastHintState.distance ||
          center !== lastHintState.center ||
          light !== lastHintState.light;
    
        document.getElementById('hints').innerText = [
          distance ? `Distance: ${distance}` : '',
          center ? `Center: ${center}` : '',
          light ? `Light: ${light}` : ''
        ].filter(Boolean).join(' | ');
    
        if (changed) {
          if (light === 'too_dark') speakPhone('Need more light', 'light-dark');
          if (distance === 'too_far') { beepBurst(950, 0.1, 220); speakPhone('Get closer', 'too-far'); }
          else if (distance === 'too_close') { beepBurst(350, 0.1, 220); speakPhone('Move away', 'too-close'); }
    
          if (center === 'off_center') speakPhone('Center the object', 'off-center');
          else if (center === 'slightly_off') speakPhone('Slightly center', 'slightly-off');
    
          lastHintState = { distance, center, light };
        }
    
        // ❌ Eliminado: no anunciar “Take the picture now”
        // if (ready) { ... }
      }
    
      // ======== LIVE PREVIEW TTS: anunciar objeto detectado una vez por aparición ========
      let lastPreviewLabel = null;
    
      // ======== Start guidance ========
      document.getElementById('startBtn').addEventListener('click', async () => {
        try {
          await ensureAudioUnlocked();
          speakPhone("Guidance started", "start");
    
          mediaStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' }, audio: false
          });
          const video = document.getElementById('preview');
          video.srcObject = mediaStream;
          await video.play();
    
          const canvas = document.getElementById('frame');
          const ctx = canvas.getContext('2d');
    
          guideTimer = setInterval(async () => {
            if (video.readyState < 2) return;
            const w = video.videoWidth, h = video.videoHeight;
            if (!w || !h) return;
            canvas.width = w; canvas.height = h;
            ctx.drawImage(video, 0, 0, w, h);
            const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.7));
            const fd = new FormData(); fd.append('file', blob, 'guide.jpg');
            const r = await fetch(`${API_BASE}/guide`, { method: 'POST', body: fd });
            const data = await r.json();
    
            // Hints de guía (sin “ready”)
            updateGuidance(data.hints /*, data.ready */);
    
            // Texto en pantalla
            if (data.object_detected) {
              document.getElementById('status').innerText =
                `Preview: ${data.object_detected} (${(data.confidence * 100).toFixed(1)}%)`;
            } else {
              document.getElementById('status').innerText = 'Preview: scanning...';
            }
    
            // 🎤 VOZ EN DIRECTO DEL OBJETO: una vez por aparición/cambio
            if (data.object_detected) {
              const label = String(data.object_detected);
              if (label !== lastPreviewLabel) {
                speakPhone(`Object detected: ${label}`, `live-${label}`);
                lastPreviewLabel = label;
              }
            } else {
              // Al volver a “scanning…”, resetea para poder anunciar el próximo objeto
              if (lastPreviewLabel !== null) lastPreviewLabel = null;
            }
          }, 500);
        } catch (e) {
          document.getElementById('status').innerText = 'Camera permission denied or not available';
        }
      });
    
      // ======== Stop guidance ========
      document.getElementById('stopBtn').addEventListener('click', () => {
        if (guideTimer) { clearInterval(guideTimer); guideTimer = null; }
        stopBeep();
        window.speechSynthesis.cancel();
        lastHintState = { distance: null, center: null, light: null };
        lastSpokenKey = ""; lastSpeakAt = 0;
        lastPreviewLabel = null;
    
        const v = document.getElementById('preview');
        if (v && v.srcObject) {
          v.pause();
          v.srcObject.getTracks().forEach(t => t.stop());
          v.srcObject = null;
        }
        document.getElementById('hints').innerText = '';
        document.getElementById('status').innerText = 'Guidance stopped';
      });
    
      // ======== Capture -> /detect ========
      document.getElementById('captureBtn').addEventListener('click', () => {
        const inp = document.getElementById('imageInput');
        inp.value = ''; inp.click();
      });
    
      document.getElementById('imageInput').addEventListener('change', async (ev) => {
        if (ev.target.files.length === 0) return;
        const fd = new FormData();
        fd.append('file', ev.target.files[0]);
        document.getElementById('status').innerText = 'Detecting...';
        try {
          const r = await fetch(`${API_BASE}/detect`, { method: 'POST', body: fd });
          const data = await r.json();
          updateGuidance(data.hints /*, false */);
          if (data.object_detected) {
            // También decir el resultado final en el iPhone
            speakPhone(`${data.object_detected} detected`, "final-detected");
            document.getElementById('status').innerText =
              `ID: ${data.id} - Detected: ${data.object_detected} (${(data.confidence * 100).toFixed(1)}%)`;
            currentDetectionId = data.id;
            document.getElementById('correctionSection').style.display = 'block';
          } else {
            speakPhone("No object detected", "final-none");
            document.getElementById('status').innerText = data.message || 'Not detected';
            currentDetectionId = null;
            document.getElementById('correctionSection').style.display = 'none';
          }
        } catch (e) {
          document.getElementById('status').innerText = 'Error connecting to API';
        }
      });
    
      // ======== Botón de test ========
      document.getElementById('audioTestBtn').addEventListener('click', async () => {
        await ensureAudioUnlocked();
        await beepBurst(800, 0.2, 300);
        speakPhone("Audio enabled, guidance will speak now", "audio-test");
      });
    
      // ======== Corrección ========
      document.getElementById('correctBtn').addEventListener('click', async () => {
        if (!currentDetectionId) { alert('No detection to correct'); return; }
        const newLabel = document.getElementById('newLabel').value.trim();
        if (!newLabel) { alert('Enter correct label'); return; }
        const fd = new FormData();
        fd.append('id', currentDetectionId);
        fd.append('new_label', newLabel);
        try {
          const r = await fetch(`${API_BASE}/correct`, { method: 'POST', body: fd });
          const result = await r.json();
          if (result.status === 'updated' || result.status === 'updated_and_training_in_background') {
            alert(`Label updated to: ${newLabel}`);
            document.getElementById('status').innerText = `ID: ${currentDetectionId} - Updated label: ${newLabel}`;
          } else {
            alert('Detection not found to update');
          }
        } catch (e) {
          alert('Error sending correction');
        }
      });
    </script>    
    
  </body>
</html>
